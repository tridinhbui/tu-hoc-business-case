<script>
/* Theme boot — chạy trước khi paint để không nháy trắng.
   Không đặt data-theme nếu người dùng chưa chọn: khi đó prefers-color-scheme quyết định. */
(function(){try{var t=localStorage.getItem("caselab.theme");
if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
function toggleTheme(){
  var r=document.documentElement,cur=r.getAttribute("data-theme");
  if(!cur)cur=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  var next=cur==="dark"?"light":"dark";
  r.setAttribute("data-theme",next);
  try{localStorage.setItem("caselab.theme",next);}catch(e){}
  paintThemeBtn();
}
function paintThemeBtn(){
  var b=document.getElementById("themeBtn"); if(!b)return;
  var r=document.documentElement.getAttribute("data-theme")
      ||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  b.textContent = r==="dark" ? "☀" : "☾";
  b.title = r==="dark" ? "Chuyển sang nền sáng" : "Chuyển sang nền tối";
}
addEventListener("DOMContentLoaded",paintThemeBtn);
</script>
